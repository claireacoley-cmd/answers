[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pretty URL for the editor
[[redirects]]
  from = "/write"
  to = "/write/index.html"
  status = 200

[[headers]]
  for = "/write/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
